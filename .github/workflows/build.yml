# tolunnet CI — Round 3 §B.1.
#
# Two jobs on every push (no branch filter) + manual dispatch:
#   host  — native gcc unit tests (make test-host, TAP output, sanitizers)
#   amiga — cross-compile with amiga-gcc 6.5 (the release toolchain, built
#           from pinned commits by ci/build-toolchain.sh and cached),
#           package (LhA + Gotek ADF set, both read back byte for byte),
#           upload artefacts. Do not change the compiler flags.

name: build

on:
  push:
  workflow_dispatch:

jobs:
  host:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # installer_lint --selftest runs the lint against historic
          # installer scripts via `git show <rev>:...` - needs the history
          fetch-depth: 0

      - name: Host toolchain
        run: |
          gcc --version | head -1
          python3 --version

      - name: Run host tests (TAP)
        run: make test-host HOSTCC=gcc

  amiga:
    name: amiga-gcc build + package
    runs-on: ubuntu-24.04
    env:
      PREFIX: /opt/amiga
    steps:
      - uses: actions/checkout@v4

      # The sebastianbergmann/amiga-gcc image is gone and AmigaPorts ships
      # prebuilt GCC 16 only. Releases are built with amiga-gcc 6.5.0b, so
      # CI builds that exact toolchain (every project pinned in
      # ci/build-toolchain.sh) once and caches it; the key is the script's
      # hash, so changing a pin rebuilds.
      - name: Toolchain cache
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /opt/amiga
          key: amiga-gcc-6.5-${{ runner.os }}-${{ hashFiles('ci/build-toolchain.sh') }}

      - name: Toolchain build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget git gcc g++ lhasa libgmp-dev \
            libmpfr-dev libmpc-dev flex bison gettext texinfo \
            libncurses-dev autoconf rsync libreadline-dev python3-pip

      - name: Build amiga-gcc 6.5 (cache miss only)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p "$PREFIX" && sudo chown "$USER" "$PREFIX"
          ci/build-toolchain.sh

      - name: Toolchain sanity check
        run: |
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/m68k-amigaos-gcc" --version | head -1

      - name: Build binaries (incl. SocketConformance)
        run: make all

      # 9.15: the Gotek ADF set is built and byte-parity-checked here too -
      # build_adf.py and check_package_parity.py FAIL under CI=true when
      # xdftool (amitools) is missing instead of skipping with a warning.
      - name: amitools (xdftool) for the ADF set
        run: |
          python3 -m pip install --user amitools || python3 -m pip install --user --break-system-packages amitools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v xdftool

      - name: Package LhA + ADF set
        run: make package

      - name: Artefact listing
        run: ls -l build build/release/tolunnet/C || true

      - name: Upload LhA archive
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-lha
          path: build/*.lha
          if-no-files-found: error

      - name: Upload release assets (lha + 2 ADFs + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-release-assets
          path: build/release-assets/
          if-no-files-found: error

      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-release
          path: build/release/
          if-no-files-found: error
