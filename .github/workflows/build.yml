# tolunnet CI — Round 3 §B.1.
#
# Two jobs on every push (no branch filter) + manual dispatch:
#   host  — native gcc unit tests (make test-host, TAP output, sanitizers)
#   amiga — cross-compile with amiga-gcc, package, upload artefacts
#
# Container: sebastianbergmann/amiga-gcc (Bebbo amiga-gcc). If the image is
# ever unavailable, fall back to the AmigaPorts prebuilt (QUESTIONS.md) — do
# not change the compiler flags.

name: build

on:
  push:
  workflow_dispatch:

jobs:
  host:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host toolchain
        run: |
          gcc --version | head -1
          python3 --version

      - name: Run host tests (TAP)
        run: make test-host HOSTCC=gcc

  amiga:
    name: amiga-gcc build + package
    runs-on: ubuntu-latest
    container:
      image: sebastianbergmann/amiga-gcc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain sanity check
        run: |
          which m68k-amigaos-gcc || { echo "m68k-amigaos-gcc not found in image"; exit 1; }
          m68k-amigaos-gcc --version | head -1

      - name: Build binaries (incl. SocketConformance)
        run: make all

      - name: Package LhA
        run: make package

      - name: Artefact listing
        run: ls -l build build/release/tolunnet/C || true

      - name: Upload LhA archive
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-lha
          path: build/*.lha
          if-no-files-found: error

      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-release
          path: build/release/
          if-no-files-found: error
