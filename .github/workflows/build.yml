# tolunnet CI — Round 3 §B.1.
#
# Two jobs on every push (no branch filter) + manual dispatch:
#   host  — native gcc unit tests (make test-host, TAP output, sanitizers)
#   amiga — cross-compile with amiga-gcc, package (LhA + Gotek ADF set,
#           both read back byte for byte), upload artefacts
#
# Container: sebastianbergmann/amiga-gcc (Bebbo amiga-gcc). If the image is
# ever unavailable, fall back to the AmigaPorts prebuilt (QUESTIONS.md) — do
# not change the compiler flags.

name: build

on:
  push:
  workflow_dispatch:

jobs:
  host:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host toolchain
        run: |
          gcc --version | head -1
          python3 --version

      - name: Run host tests (TAP)
        run: make test-host HOSTCC=gcc

  amiga:
    name: amiga-gcc build + package
    runs-on: ubuntu-latest
    container:
      image: sebastianbergmann/amiga-gcc:latest
    steps:
      - uses: actions/checkout@v4

      # 11ab item 5: make package calls several Python scripts; this
      # container may ship without python3. Fail-visible either way.
      - name: python3 guard (packaging scripts need it)
        run: |
          python3 --version || { apt-get update && apt-get install -y python3; }
          python3 --version

      - name: Toolchain sanity check
        run: |
          which m68k-amigaos-gcc || { echo "m68k-amigaos-gcc not found in image"; exit 1; }
          m68k-amigaos-gcc --version | head -1

      - name: Build binaries (incl. SocketConformance)
        run: make all

      # 9.15: the Gotek ADF set is built and byte-parity-checked here too -
      # build_adf.py and check_package_parity.py FAIL under CI=true when
      # xdftool (amitools) is missing instead of skipping with a warning.
      - name: amitools (xdftool) for the ADF set
        run: |
          python3 -m pip --version || { apt-get update && apt-get install -y python3-pip; }
          python3 -m pip install amitools || python3 -m pip install --break-system-packages amitools
          command -v xdftool

      - name: Package LhA + ADF set
        run: make package

      - name: Artefact listing
        run: ls -l build build/release/tolunnet/C || true

      - name: Upload LhA archive
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-lha
          path: build/*.lha
          if-no-files-found: error

      - name: Upload release assets (lha + 2 ADFs + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-release-assets
          path: build/release-assets/
          if-no-files-found: error

      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: tolunnet-release
          path: build/release/
          if-no-files-found: error
